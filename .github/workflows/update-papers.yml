name: Update papers

on:
  schedule:
    - cron: "17 11 * * *" # daily, ~7am US Eastern
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Anthropic SDK (only used if the secret is set)
        if: env.ANTHROPIC_API_KEY != ''
        run: pip install anthropic
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Fetch papers
        run: python scripts/fetch_papers.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/papers.json
          if ! git diff --cached --quiet; then git commit -m "Update papers" && git push; fi
