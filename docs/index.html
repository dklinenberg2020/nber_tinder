<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBER Swipe</title>
<meta name="description" content="Swipe through new NBER working papers. Right to save, left to skip.">
<meta name="theme-color" content="#f6f4ef">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NBER Swipe">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --ink: #1d1d1f;
    --muted: #6b6b70;
    --line: #e4e1d9;
    --accent: #1f5f8b;
    --yes: #1f8a5b;
    --no: #c2412d;
    --shadow: 0 10px 30px rgba(30, 25, 10, .12), 0 2px 6px rgba(30, 25, 10, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --card: #1f1f23;
      --ink: #f1f0ec;
      --muted: #a2a1a8;
      --line: #33333a;
      --accent: #7cb7e3;
      --yes: #4cc38a;
      --no: #f07662;
      --shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 2px 6px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
    overscroll-behavior: none;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) 16px 12px;
    max-width: 560px; width: 100%; margin: 0 auto;
  }
  h1 { font: 700 20px/1 Georgia, "Times New Roman", serif; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  nav { display: flex; background: var(--line); border-radius: 999px; padding: 3px; }
  nav button {
    border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 14px; font-weight: 600;
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
  }
  nav button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  main { flex: 1; display: flex; flex-direction: column; max-width: 560px; width: 100%; margin: 0 auto; padding: 0 16px 16px; min-height: 0; }
  [hidden] { display: none !important; }

  /* Discover */
  #discover { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .meta-row { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; padding: 0 2px 10px; }
  #stack { position: relative; flex: 1; min-height: 360px; }
  .card {
    position: absolute; inset: 0;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
    padding: 24px 22px 20px; display: flex; flex-direction: column; gap: 14px;
    touch-action: none; user-select: none; cursor: grab; overflow: hidden;
    will-change: transform;
  }
  .card.behind { transform: scale(.955) translateY(12px); opacity: .7; pointer-events: none; }
  .card.dragging { cursor: grabbing; }
  .card.fly { transition: transform .35s ease-out, opacity .35s ease-out; }
  .card.snap { transition: transform .2s ease-out; }
  .card .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .year { font-weight: 700; font-size: 13px; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); padding: 4px 10px; border-radius: 999px; }
  .wp { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card h2 { font: 700 clamp(21px, 5.4vw, 26px)/1.22 Georgia, "Times New Roman", serif; margin: 0; letter-spacing: -.01em; }
  .authors { color: var(--muted); font-size: 14px; margin: -4px 0 0; }
  .summary { margin: 0; font-size: 16px; overflow-y: auto; flex: 1; min-height: 0; }
  .summary .label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .open-hint { font-size: 13px; color: var(--accent); font-weight: 600; }
  .stamp {
    position: absolute; top: 64px; padding: 4px 12px; border: 3px solid; border-radius: 8px;
    font-weight: 800; font-size: 22px; letter-spacing: .06em; opacity: 0; pointer-events: none;
  }
  .stamp.yes { left: 20px; color: var(--yes); transform: rotate(-12deg); }
  .stamp.no { right: 20px; color: var(--no); transform: rotate(12deg); }
  .controls { display: flex; justify-content: center; align-items: center; gap: 22px; padding: 18px 0 max(4px, env(safe-area-inset-bottom)); }
  .controls button {
    width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--line); background: var(--card);
    box-shadow: var(--shadow); font-size: 26px; cursor: pointer; display: grid; place-items: center; color: var(--ink);
    transition: transform .1s;
  }
  .controls button:active { transform: scale(.92); }
  .controls .no { color: var(--no); }
  .controls .yes { color: var(--yes); }
  .controls .small { width: 48px; height: 48px; font-size: 18px; color: var(--muted); }
  .controls button:disabled { opacity: .35; cursor: default; }
  .keys { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
  @media (hover: none) { .keys { display: none; } }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px; }
  .empty strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 6px; }

  /* Saved */
  #saved { flex: 1; overflow-y: auto; }
  .saved-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 4px 0 12px; flex-wrap: wrap; }
  .saved-head h2 { margin: 0; font-size: 17px; }
  .btn { border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 10px; cursor: pointer; }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .item a { color: var(--ink); text-decoration: none; font: 700 17px/1.3 Georgia, "Times New Roman", serif; }
  .item a:hover { color: var(--accent); }
  .item .sub { color: var(--muted); font-size: 13px; margin: 4px 0 6px; }
  .item p { margin: 0; font-size: 14px; }
  .item .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
  .item .row .btn { padding: 5px 10px; font-size: 12px; }
  .none { color: var(--muted); text-align: center; padding: 40px 10px; }
  h1 { margin-right: auto; }
  .gear { border: 0; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; padding: 4px 6px; line-height: 1; }
  .src { font-weight: 700; font-size: 11px; letter-spacing: .04em; color: var(--muted); border: 1px solid var(--line); padding: 2px 7px; border-radius: 999px; margin-right: 4px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: -6px; }
  .tag { font-size: 12px; font-weight: 700; color: var(--yes); background: color-mix(in srgb, var(--yes) 13%, transparent); padding: 2px 9px; border-radius: 999px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; z-index: 20; }
  .modal form { background: var(--card); color: var(--ink); border-radius: 16px; padding: 20px; max-width: 420px; width: 100%; max-height: calc(100% - 32px); overflow-y: auto; box-shadow: var(--shadow); }
  .modal h2 { margin: 0 0 6px; font-size: 17px; }
  .modal h2:not(:first-child) { margin-top: 18px; }
  .modal p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { font: inherit; font-size: 14px; font-weight: 600; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); cursor: pointer; }
  .chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .field { display: block; margin-top: 14px; font-size: 14px; font-weight: 600; }
  .field span { color: var(--muted); font-weight: 400; }
  .field input { display: block; width: 100%; margin-top: 6px; font: inherit; font-weight: 400; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .modal .row { display: flex; justify-content: flex-end; margin-top: 18px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px;
    transition: .2s; pointer-events: none; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<header>
  <h1>NBER <span>Swipe</span></h1>
  <button class="gear" id="open-prefs" title="Topics &amp; sources" aria-label="Topics and sources">⚙︎</button>
  <nav role="tablist">
    <button role="tab" id="tab-discover" aria-selected="true">Discover</button>
    <button role="tab" id="tab-saved" aria-selected="false">Saved <span id="saved-count"></span></button>
  </nav>
</header>

<main>
  <section id="discover">
    <div class="meta-row"><span id="remaining">Loading papers…</span><span id="updated"></span></div>
    <div id="stack"></div>
    <div class="controls">
      <button class="small" id="undo" title="Undo (U)" aria-label="Undo">↺</button>
      <button class="no" id="btn-no" title="Skip (←)" aria-label="Skip">✕</button>
      <button class="yes" id="btn-yes" title="Read later (→)" aria-label="Read later">♥</button>
      <button class="small" id="btn-open" title="Open paper (Enter)" aria-label="Open paper">↗</button>
    </div>
    <div class="keys">← skip · → save · Enter open · U undo</div>
  </section>

  <section id="saved" hidden>
    <div class="saved-head">
      <h2>Read later</h2>
      <div>
        <button class="btn" id="copy">Copy list</button>
        <button class="btn" id="reset" title="Show skipped papers again">Reset skipped</button>
      </div>
    </div>
    <ul class="list" id="saved-list"></ul>
  </section>
</main>
<div class="modal" id="prefs" hidden>
  <form id="prefs-form">
    <h2>Your topics</h2>
    <p>Papers matching these come first, mixed with the newest papers (2 topic matches, then 1 new paper).</p>
    <div class="chips" id="topic-chips"></div>
    <label class="field">Other keywords <span>(comma-separated)</span>
      <input id="custom-keywords" placeholder="e.g. sovereign debt, steel" autocomplete="off">
    </label>
    <h2>Sources</h2>
    <div class="chips" id="source-chips"></div>
    <div class="row"><button type="submit" class="btn primary">Done</button></div>
  </form>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const KEY = "nberSwipe.v1";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // --- state (saved in this browser only) ---
  let state = { seen: {}, saved: [], history: [] };
  try { Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch {}
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

  let papers = [];
  let queue = [];

  // --- topics & ranking ---
  // Each topic: regexes tried against title, abstract and keywords/JEL codes (title hits count triple).
  const TOPICS = [
    { id: "geo", name: "Geoeconomics", on: true, re: [/geo-?econom/, /geopolit/, /sanction/, /coerci/, /export controls?/, /fragmentation/, /friend-?shoring/, /de-?risking/, /decoupl/, /(national|economic) security/, /weaponi[sz]/, /statecraft/, /industrial polic/, /critical minerals?/, /rare earth/, /u\.?s\.?-china|china-u\.?s\./, /dollar dominance/, /reserve currenc/, /jel:.*\bf5\d/] },
    { id: "trade", name: "Trade", on: true, re: [/\btrade\b(?!-off| ?offs?\b| credit)/, /tariff/, /\bimport(s|ed|ing|ers?)?\b/, /\bexport(s|ed|ing|ers?)?\b/, /(supply|value) chains?/, /offshor|reshor|nearshor/, /\bwto\b/, /protectionis/, /gravity (model|equation)/, /customs union/, /jel:.*\bf1\d/] },
    { id: "synth", name: "Synthetic control", on: true, re: [/synthetic control/, /synthetic diff/, /synthetic did/, /synthetic counterfactual/, /comparative case stud/] },
    { id: "money", name: "Monetary policy", re: [/monetary policy/, /central bank/, /interest rates?/, /inflation/, /jel:.*\be5\d/] },
    { id: "finance", name: "Finance & banking", re: [/\bbanks?\b|banking/, /financial stability/, /asset pric/, /\bcredit\b/, /jel:.*\bg[12]\d/] },
    { id: "labor", name: "Labor", re: [/labou?r market/, /\bwages?\b/, /employment/, /jel:.*\bj\d\d/] },
    { id: "dev", name: "Development", re: [/developing countr/, /low-income countr/, /poverty/, /jel:.*\bo1\d/] },
    { id: "climate", name: "Climate & energy", re: [/climate/, /carbon/, /emissions/, /\benergy\b/, /jel:.*\bq[45]\d/] },
    { id: "ai", name: "AI & technology", re: [/artificial intelligence/, /\bai\b/, /machine learning/, /automation/, /large language model/] },
    { id: "pol", name: "Political economy", re: [/election/, /voting|voters/, /populis/, /polariz/, /jel:.*\bd7\d/] },
    { id: "fiscal", name: "Fiscal & public debt", re: [/fiscal/, /public debt|sovereign debt/, /\btax(es|ation)?\b/, /jel:.*\bh[56]\d/] },
  ];
  state.prefs = state.prefs || { topics: TOPICS.filter((t) => t.on).map((t) => t.id), custom: "", hiddenSources: [] };

  const sourceGroup = (p) => (p.source || "NBER").replace(/^Fed .*/, "Fed");
  const escapeRe = (k) => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const topicCache = new Map();
  let active = [];
  function activeTopics() {
    const list = TOPICS.filter((t) => state.prefs.topics.includes(t.id));
    state.prefs.custom.split(",").map((k) => k.trim().toLowerCase()).filter(Boolean)
      .forEach((k) => list.push({ name: k, re: [new RegExp(escapeRe(k))] }));
    return list;
  }
  function matchedTopics(p) {
    if (!topicCache.has(p.id)) {
      const title = p.title.toLowerCase();
      const body = ((p.abstract || p.summary || "") + " " + (p.keywords || "")).toLowerCase();
      const hits = [];
      for (const t of active) if (t.re.some((re) => re.test(title) || re.test(body))) hits.push(t.name);
      topicCache.set(p.id, hits);
    }
    return topicCache.get(p.id);
  }

  function buildQueue() {
    topicCache.clear();
    active = activeTopics();
    const pool = papers.filter((p) => !state.seen[p.id] && !state.prefs.hiddenSources.includes(sourceGroup(p)));
    const relevant = [], other = [];
    for (const p of pool) (matchedTopics(p).length ? relevant : other).push(p);
    // papers.json is newest first; alternate 2 topic matches with 1 of the newest other papers
    queue = [];
    let r = 0, o = 0;
    while (r < relevant.length || o < other.length) {
      for (let k = 0; k < 2 && r < relevant.length; k++) queue.push(relevant[r++]);
      if (o < other.length) queue.push(other[o++]);
    }
  }

  // --- preferences sheet ---
  function renderPrefs() {
    $("topic-chips").innerHTML = TOPICS.map((t) => `<button type="button" data-topic="${t.id}" aria-pressed="${state.prefs.topics.includes(t.id)}">${esc(t.name)}</button>`).join("");
    const sources = [...new Set(papers.map(sourceGroup))];
    $("source-chips").innerHTML = sources.map((s) => `<button type="button" data-source="${esc(s)}" aria-pressed="${!state.prefs.hiddenSources.includes(s)}">${esc(s)}</button>`).join("");
    $("custom-keywords").value = state.prefs.custom;
  }
  $("open-prefs").onclick = () => { renderPrefs(); $("prefs").hidden = false; };
  $("prefs-form").onclick = (e) => {
    const b = e.target.closest("button[aria-pressed]");
    if (b) b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true");
  };
  $("prefs-form").onsubmit = (e) => {
    e.preventDefault();
    state.prefs.topics = [...document.querySelectorAll("[data-topic][aria-pressed=true]")].map((b) => b.dataset.topic);
    state.prefs.hiddenSources = [...document.querySelectorAll("[data-source][aria-pressed=false]")].map((b) => b.dataset.source);
    state.prefs.custom = $("custom-keywords").value;
    persist();
    $("prefs").hidden = true;
    buildQueue(); render();
  };
  $("prefs").onclick = (e) => { if (e.target.id === "prefs") $("prefs-form").requestSubmit(); };

  // --- rendering ---
  function cardHTML(p) {
    const authors = p.authors.length > 4 ? p.authors.slice(0, 4).join(", ") + " et al." : p.authors.join(", ");
    return `
      <div class="top"><span class="year">${esc(p.year)}</span><span class="wp"><span class="src">${esc(p.source || "NBER")}</span> ${esc(p.displaydate)}</span></div>
      <h2>${esc(p.title)}</h2>
      <p class="authors">${esc(authors)}</p>
      ${matchedTopics(p).length ? `<div class="tags">${matchedTopics(p).map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
      <p class="summary"><span class="label">${p.ai_summary ? "Summary" : "From the abstract"}</span>${esc(p.summary)}</p>
      <span class="open-hint">Tap to open paper ↗</span>
      <span class="stamp yes">SAVE</span><span class="stamp no">SKIP</span>`;
  }

  function render() {
    const stack = $("stack");
    stack.innerHTML = "";
    const [top, next] = queue;
    if (next) {
      const c = document.createElement("article");
      c.className = "card behind";
      c.innerHTML = cardHTML(next);
      stack.appendChild(c);
    }
    if (top) {
      const c = document.createElement("article");
      c.className = "card";
      c.innerHTML = cardHTML(top);
      stack.appendChild(c);
      attachDrag(c, top);
    } else if (papers.length) {
      stack.innerHTML = `<div class="empty"><div><strong>You're all caught up 🎉</strong>New papers are added as NBER releases them.<br>Check your Saved list, or reset skipped papers there.</div></div>`;
    }
    $("remaining").textContent = papers.length ? `${queue.length} papers left` : "";
    $("btn-no").disabled = $("btn-yes").disabled = $("btn-open").disabled = !top;
    $("undo").disabled = !state.history.length;
    $("saved-count").textContent = state.saved.length ? `(${state.saved.length})` : "";
  }

  function renderSaved() {
    const list = $("saved-list");
    if (!state.saved.length) {
      list.innerHTML = `<li class="none">Nothing saved yet. Swipe right on papers you want to read later.</li>`;
      return;
    }
    list.innerHTML = state.saved.map((p) => `
      <li class="item">
        <a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>
        <div class="sub">${esc(p.source || "NBER")} · ${esc(p.year)}${p.authors.length ? " · " + esc(p.authors.join(", ")) : ""}</div>
        <p>${esc(p.summary)}</p>
        <div class="row"><button class="btn" data-remove="${esc(p.id)}">Remove</button></div>
      </li>`).join("");
  }

  // --- actions ---
  function decide(dir) {
    const p = queue[0];
    if (!p) return;
    const card = $("stack").querySelector(".card:not(.behind)");
    state.seen[p.id] = dir;
    state.history.push(p.id);
    if (state.history.length > 50) state.history.shift();
    if (dir === "R" && !state.saved.some((s) => s.id === p.id)) {
      const { abstract, ...snap } = p; // keep storage small
      state.saved.unshift(snap);
    }
    persist();
    queue.shift();
    if (card) {
      card.classList.add("fly");
      const x = (dir === "R" ? 1 : -1) * (window.innerWidth + 200);
      card.style.transform = `translate(${x}px, 40px) rotate(${dir === "R" ? 24 : -24}deg)`;
      card.style.opacity = "0";
      setTimeout(render, 220);
    } else render();
  }

  function undo() {
    const id = state.history.pop();
    if (!id) return;
    delete state.seen[id];
    state.saved = state.saved.filter((s) => s.id !== id);
    persist();
    const p = papers.find((x) => x.id === id);
    if (p) queue.unshift(p);
    render();
  }

  const open = (p) => p && window.open(p.url, "_blank", "noopener");

  // --- drag / swipe ---
  function attachDrag(card, p) {
    let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false, moved = false;
    const yes = card.querySelector(".stamp.yes"), no = card.querySelector(".stamp.no");

    card.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".summary") && e.pointerType === "mouse" && e.offsetX > e.target.clientWidth) return; // scrollbar
      dragging = true; moved = false; startX = e.clientX; startY = e.clientY; dx = dy = 0;
      card.setPointerCapture(e.pointerId);
      card.classList.add("dragging");
      card.classList.remove("snap");
    });
    card.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      dx = e.clientX - startX; dy = e.clientY - startY;
      if (Math.abs(dx) > 6 || Math.abs(dy) > 6) moved = true;
      card.style.transform = `translate(${dx}px, ${dy * 0.3}px) rotate(${dx / 18}deg)`;
      yes.style.opacity = Math.max(0, Math.min(1, dx / 100));
      no.style.opacity = Math.max(0, Math.min(1, -dx / 100));
    });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      card.classList.remove("dragging");
      const threshold = Math.min(120, card.offsetWidth * 0.28);
      if (dx > threshold) return decide("R");
      if (dx < -threshold) return decide("L");
      card.classList.add("snap");
      card.style.transform = "";
      yes.style.opacity = no.style.opacity = 0;
      if (!moved) open(p);
    };
    card.addEventListener("pointerup", end);
    card.addEventListener("pointercancel", end);
  }

  // --- wiring ---
  function showTab(name) {
    $("discover").hidden = name !== "discover";
    $("saved").hidden = name !== "saved";
    $("tab-discover").setAttribute("aria-selected", name === "discover");
    $("tab-saved").setAttribute("aria-selected", name === "saved");
    if (name === "saved") renderSaved();
  }
  $("tab-discover").onclick = () => showTab("discover");
  $("tab-saved").onclick = () => showTab("saved");
  $("btn-no").onclick = () => decide("L");
  $("btn-yes").onclick = () => decide("R");
  $("btn-open").onclick = () => open(queue[0]);
  $("undo").onclick = undo;

  $("saved-list").onclick = (e) => {
    const id = e.target.dataset.remove;
    if (!id) return;
    state.saved = state.saved.filter((s) => s.id !== id);
    persist(); renderSaved(); render();
  };
  $("reset").onclick = () => {
    for (const [id, d] of Object.entries(state.seen)) if (d === "L") delete state.seen[id];
    state.history = state.history.filter((id) => state.seen[id]);
    persist(); buildQueue(); render(); toast("Skipped papers are back in the deck");
  };
  $("copy").onclick = async () => {
    const text = state.saved.map((p) => `${p.title} (${p.year}) — ${p.url}`).join("\n");
    try { await navigator.clipboard.writeText(text); toast("Copied " + state.saved.length + " papers"); }
    catch { toast("Couldn't copy"); }
  };

  document.addEventListener("keydown", (e) => {
    if ($("discover").hidden || !$("prefs").hidden || e.target.closest("input") || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "ArrowLeft") decide("L");
    else if (e.key === "ArrowRight") decide("R");
    else if (e.key === "Enter") open(queue[0]);
    else if (e.key.toLowerCase() === "u" || e.key === "Backspace") undo();
  });

  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  fetch("papers.json", { cache: "no-cache" })
    .then((r) => r.json())
    .then((data) => {
      papers = data.papers;
      $("updated").textContent = data.updated ? `Updated ${data.updated}` : "";
      buildQueue(); render();
    })
    .catch(() => { $("remaining").textContent = "Couldn't load papers.json"; });
})();
</script>
</body>
</html>
